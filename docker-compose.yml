services:
  db:
    image: postgres:16-alpine
    container_name: futbot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-futbot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-futbot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futbot_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # En Docker, la base de datos no es "localhost", sino el nombre del servicio ("db")
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-futbot_db}
    volumes:
      # Mapeo de volumen para habilitar Hot-Reloading en desarrollo
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: